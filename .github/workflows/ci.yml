name: CI

# A draft pull request runs no jobs. `ready_for_review` is in the types so that
# marking it ready starts the run: without it the skipped jobs would stand as
# passing required checks on the commit and nothing would have tested it. A push
# to main still runs, as the only test of the merged tree.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: python/spec-kit
            module: dfo_spec_kit
          - package: python/frame-grammar
            module: dfo_frame_grammar
          - package: python/dfo-spec-kit-components
            module: dfo_spec_kit_components
          - package: python/provenance-docs
            module: dfo_provenance_docs
          - package: python/descriptions
            module: dfo_descriptions
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles(format('{0}/uv.lock', matrix.package)) }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run ty
        run: uv run ty check src/${{ matrix.module }}

  test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            python/spec-kit,
            python/frame-grammar,
            python/dfo-spec-kit-components,
            python/provenance-docs,
            python/descriptions,
          ]
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles(format('{0}/uv.lock', matrix.package)) }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Run pytest
        run: uv run pytest

  registry:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          # full history + tags: the validator's immutability check diffs the
          # registry against the latest release tag
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Validate code registry
        run: uv run tools/validate_registry.py

      - name: Validate unit registry
        run: uv run tools/validate_unit_registry.py

      - name: Test the registry validator
        run: uv run --with jsonschema --with pytest pytest tools/tests -q

      - name: Validate identity vectors
        run: uv run tools/validate_vectors.py

      - name: Validate frame grammar vectors
        run: uv run tools/validate_frame_vectors.py

      - name: Validate unit vectors
        run: uv run tools/validate_unit_vectors.py

      - name: Validate provenance docs vectors
        run: uv run tools/validate_provenance_docs_vectors.py

      - name: Validate step and description vectors
        run: uv run tools/validate_descriptions_vectors.py
